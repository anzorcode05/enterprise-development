name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore TransportCompany/TransportCompany.slnx

      - name: Build
        run: dotnet build TransportCompany/TransportCompany.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test TransportCompany/TransportCompany.slnx --no-build --configuration Release --verbosity normal